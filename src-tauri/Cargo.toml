[package]
name = "repeater-nation-radio"
version = "0.2.56"
description = "Repeater Nation desktop radio"
authors = ["Repeater Nation"]
edition = "2021"

[lib]
name = "repeater_nation_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "time"] }

# Game controllers and the Bluetooth PTT button: desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gilrs = "0.11"
btleplug = "0.11"

# Bluetooth PTT buttons on Android and iPhone.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-blec = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

# Smaller, faster release binary (Tauri's recommended release profile).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
