[package]
name = "repeater-nation-radio"
version = "0.1.0"
description = "Repeater Nation desktop radio"
authors = ["Repeater Nation"]
edition = "2021"

[lib]
name = "repeater_nation_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
