<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- signal waves from the antenna tip -->
  <g fill="none" stroke="#f97316" stroke-linecap="round">
    <path d="M499 89 A80 80 0 0 1 499 191" stroke-width="34"/>
    <path d="M553 44 A150 150 0 0 1 553 236" stroke-width="34" opacity=".6"/>
    <path d="M377 89 A80 80 0 0 0 377 191" stroke-width="34"/>
    <path d="M323 44 A150 150 0 0 0 323 236" stroke-width="34" opacity=".6"/>
  </g>
  <!-- antenna and top knob -->
  <rect x="410" y="132" width="56" height="270" rx="28" fill="#e5e7eb"/>
  <circle cx="438" cy="140" r="34" fill="#f97316"/>
  <rect x="584" y="296" width="74" height="90" rx="18" fill="#9ca3af"/>
  <!-- side PTT button -->
  <rect x="318" y="480" width="52" height="150" rx="20" fill="#c2410c"/>
  <!-- radio body -->
  <rect x="352" y="356" width="340" height="560" rx="66" fill="url(#body)"/>
  <!-- screen -->
  <rect x="398" y="414" width="248" height="156" rx="24" fill="#0b1220"/>
  <rect x="428" y="448" width="128" height="30" rx="10" fill="#34d399"/>
  <rect x="428" y="504" width="188" height="24" rx="10" fill="#475569"/>
  <!-- speaker grille -->
  <g fill="#7c2d12" opacity=".75">
    <rect x="408" y="622" width="228" height="24" rx="12"/>
    <rect x="408" y="676" width="228" height="24" rx="12"/>
    <rect x="408" y="730" width="228" height="24" rx="12"/>
    <rect x="408" y="784" width="228" height="24" rx="12"/>
    <rect x="408" y="838" width="228" height="24" rx="12"/>
  </g>
</svg>
