port: 7880            # signaling (HTTP/WebSocket) - point Nginx Proxy Manager here
rtc:
  tcp_port: 7881      # media over TCP (fallback when UDP is blocked)
  udp_port: 7882      # media over UDP (single mux port)
  use_external_ip: true   # discover public IP; or set node_ip: <public ip>
# API keys come from LIVEKIT_KEYS (see docker-compose.yml / .env).
