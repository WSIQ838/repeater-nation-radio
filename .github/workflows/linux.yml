name: Build Repeater Nation Radio for Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Signs the one-click update packages. Without this secret the build still works,
      # and the apps fall back to opening the download page.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librsvg2-bin

      - name: Install dependencies
        run: npm install

      - name: Generate platform icons
        run: |
          npx tauri icon src-tauri/icons/icon.svg
          rsvg-convert -w 512 -h 512 src-tauri/icons/icon.svg -o src-tauri/icons/icon.png

      - name: Build Linux packages
        run: |
          EXTRA=""; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && EXTRA="--config src-tauri/updater.conf.json"
          npm run tauri build -- --bundles appimage,deb,rpm $EXTRA

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-radio-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Add Linux installers to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="radio-v$VERSION"
          # The Windows workflow creates this release; wait for it so the two don't race.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Repeater Nation Radio v$VERSION" --notes-file .github/release-notes.md || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm --clobber

      # The updater replaces the AppImage; .deb and .rpm installs update from the release page.
      - name: Publish the Linux update feed
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          ASSET=$(basename "$IMG" | tr ' ' '.')
          .github/scripts/update-feed.sh linux-x86_64 "$IMG.sig" "https://github.com/${GITHUB_REPOSITORY}/releases/download/radio-v$VERSION/$ASSET"
