name: Build Repeater Nation Radio for macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build macOS app and DMG
        run: npm run tauri build -- --bundles app,dmg

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-radio-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Add macOS installer to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="radio-v$VERSION"
          # The Windows workflow creates this release; wait for it so the two don't race.
          for i in $(seq 1 40); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Repeater Nation Radio v$VERSION" --notes-file .github/release-notes.md || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg --clobber
