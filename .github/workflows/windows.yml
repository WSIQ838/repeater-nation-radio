name: Build Repeater Nation Radio for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          { echo 'body<<NOTES_EOF'; cat .github/release-notes.md; echo 'NOTES_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: radio-v__VERSION__
          releaseName: Repeater Nation Radio v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeDebug: false

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: repeater-nation-radio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
