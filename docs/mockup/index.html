<title>Repeater Nation App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a device stage. Phone = bottom tab bar + a More hub. Tablet = grouped side rail, two panes. Dark by choice. */
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#262d36; --fg:#eef1f4; --mute:#8a95a3;
  --accent:#ff8a1f; --accent-ink:#1a0e00; --good:#2fc46a; --warn:#f2c14e; --bad:#ef5350; --blue:#4aa3ff;
  --display:"Barlow Semi Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1100px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.top h1{font:700 28px/1 var(--display);margin:0;letter-spacing:.01em}
.top p{margin:6px 0 0;color:var(--mute);max-width:52ch}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 18px;border-radius:8px;color:var(--mute);font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.stage{display:flex;justify-content:center}
.fit{position:relative}
.dev{position:relative;background:#000;border:1px solid #2a323c;box-shadow:0 30px 80px #0009;overflow:hidden;display:flex;flex-direction:column}
.dev.phone{width:390px;height:810px;border-radius:44px;padding:10px}
.dev.tablet{width:1100px;height:760px;border-radius:30px;padding:12px}
.scr{flex:1;min-height:0;background:var(--bg);border-radius:34px;overflow:hidden;display:flex;position:relative}
.tablet .scr{border-radius:20px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:12px 24px 4px;font:500 12px var(--mono);flex:none}
.tablet .sb{padding:8px 20px 0}
.body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.pad{padding:8px 18px 28px}
.tablet .pad{padding:10px 28px 28px}
.tabs{display:flex;border-top:1px solid var(--line);background:#0e1115;padding:6px 6px 14px;flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:500;border-radius:10px;position:relative}
.tabs button[aria-current=page]{color:var(--accent)}
.rail{width:218px;flex:none;border-right:1px solid var(--line);background:#0e1115;padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;scrollbar-width:none}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 8px 10px;font:700 18px var(--display)}
.rail .grp{font:600 10px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:12px 12px 4px}
.rail button{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:500;text-align:left}
.rail button svg{width:19px;height:19px}
.rail button[aria-current=page]{background:var(--panel2);color:var(--fg)}
.rail button[aria-current=page] svg{color:var(--accent)}
.rail .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px 0;border-top:1px solid var(--line)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2.title{font:700 32px/1.05 var(--display);margin:2px 0 14px;text-wrap:balance}
.tablet h2.title{font-size:38px}
h3{font:600 17px var(--display);margin:0;letter-spacing:.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.link{color:var(--accent);font-weight:500;font-size:13px}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card+.card{margin-top:10px}
.hero{background:linear-gradient(135deg,#2a1604,#14181d 70%);border:1px solid #3a2410;border-radius:20px;padding:16px}
.hero .big{font:700 26px/1.05 var(--display);margin:4px 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 16px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#04200f}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:12px}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:500;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.av{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--display);letter-spacing:.04em;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.avs{display:flex;gap:14px;overflow:auto;scrollbar-width:none}
.avs div{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11px var(--mono);color:var(--mute)}
.ver{display:inline-flex;gap:4px;align-items:center;color:var(--good);font-size:11px;font-weight:600}
.ver svg{width:13px;height:13px;stroke-width:2.4}
.tag{font:500 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.o{color:var(--accent);border-color:#5a3512;background:#241608}
.tag.g{color:var(--good);border-color:#1d4d31;background:#0e2318}
.tag.b{color:var(--blue);border-color:#1f4468;background:#0e1d2d}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.dot.off{background:var(--bad)}.dot.busy{background:var(--warn)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;color:var(--fg);padding:13px 0;font:inherit;min-width:0}
.search input::placeholder{color:var(--mute)}
.item{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.item[aria-selected=true]{border-color:var(--accent);background:#1c1610}
.freq{font:500 20px var(--mono);letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat div{background:var(--panel2);border-radius:12px;padding:10px;min-width:0}
.stat b{display:block;font:500 15px var(--mono);overflow-wrap:anywhere}
.stat span{font-size:11px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);flex:1;min-height:0}
.two>.l{border-right:1px solid var(--line);overflow:auto;scrollbar-width:none}
.two>.r{overflow:auto;scrollbar-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tablet .tiles{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:92px}
.tile svg{color:var(--accent)}
.tile b{font:600 16px var(--display);letter-spacing:.02em}
.tile span{font-size:12px;color:var(--mute);line-height:1.3}
.map{position:relative;border-radius:20px;overflow:hidden;background:#10161c;border:1px solid var(--line);flex:1;min-height:300px}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin i{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #0b0d10;display:block}
.pin.m i{background:var(--blue)}
.pin[aria-pressed=true] i{box-shadow:0 0 0 6px #ff8a1f44;transform:rotate(-45deg) scale(1.2)}
.pin span{font:500 10px var(--mono);background:#0b0d10cc;padding:1px 5px;border-radius:5px;margin-top:3px}
.legend{position:absolute;left:12px;top:12px;display:flex;gap:10px;font-size:11px;background:#0b0d10cc;padding:6px 10px;border-radius:10px}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 18px 18px;position:relative;z-index:2}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.modal{position:absolute;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;border-radius:inherit}
.modal .sheet{width:100%;max-height:80%;overflow:auto}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.post p{margin:8px 0 10px}
.acts{display:flex;gap:18px;color:var(--mute);font-size:13px}
.acts button{display:flex;gap:6px;align-items:center;color:var(--mute)}
.acts button[aria-pressed=true]{color:var(--accent)}
.acts svg{width:18px;height:18px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:#3a2410;border-color:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(18px);background:var(--accent)}
.fab{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px #ff8a1f55;z-index:5}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:#0b0d10;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:30;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;padding:4px 0 8px}
.back svg{width:18px;height:18px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--fg)}
.ibtn .n{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font:600 10px var(--mono);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.price{font:600 18px var(--mono)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lst{height:84px;border-radius:12px;background:linear-gradient(135deg,#1e2833,#141a21);display:grid;place-items:center;color:var(--mute);margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fld label{font-size:12px;color:var(--mute)}
.fld input,.fld select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;min-width:0;width:100%}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--panel2);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);font-weight:500}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.eq{display:flex;gap:2px;align-items:flex-end;height:18px}
.eq i{width:3px;background:var(--good);border-radius:2px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:18px}}
.rk{font:700 18px var(--display);width:26px;text-align:center;color:var(--mute)}
.note{max-width:1100px;margin:18px auto 0;color:var(--mute);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function filtered(){
  const q=S.q.trim().toLowerCase();
  return REPS.filter(r=>{
    const f=S.filter;
    if(f==='2m'&&r.band!=='2m')return false;
    if(f==='70cm'&&r.band!=='70cm')return false;
    if(f==='Digital'&&r.mode==='FM')return false;
    if(f==='Nearby'&&r.d>12)return false;
    return !q||(r.call+r.name+r.city+r.f).toLowerCase().includes(q);
  });
}

  return `<div class="pad">${head('Outdoors','Parks & Summits')}${ch(['All','POTA','SOTA','Favorites'],'park')}${T()?`<div class="grid3"><div>${cards||'<div class="card mute">Nothing here yet. Star a park or summit.</div>'}</div><div>${sync}</div></div>`:`${sync}<div style="height:10px"></div>${cards||'<div class="card mute">Nothing here yet. Star a park or summit.</div>'}`}</div>`;
}
function forum(){
  const cats=['All','Antennas','Repeaters','Nets','Newcomers'];
  const posts=THREADS.filter(p=>S.cat==='All'||p.cat===S.cat).map(p=>`<div class="post"><div class="row">${av(p.c,p.id<3)}<div class="grow"><b>${p.n}</b> <span class="ver">${I('check')}${p.c}</span></div><span class="tag">${p.cat}</span><span class="sm mute">${p.t}</span></div>
   <p><b>${p.title}</b><br><span class="mute">${p.txt}</span></p><div class="acts"><button data-a="like" data-v="${p.id}" aria-pressed="${!!S.liked[p.id]}">${I('heart')}${p.l+(S.liked[p.id]?1:0)}</button><button data-a="toast" data-v="Reply box opens">${I('chat')}${p.r}</button></div></div>`).join('');
  const side=`<div class="card"><h3>Active now</h3><div class="avs" style="margin-top:12px;flex-wrap:wrap">${['KD5JAX','N5TOM','W5ABC','KF5QRS'].map(c=>`<div>${av(c,true)}${c}</div>`).join('')}</div></div>`;
  return `<div class="pad">${head('The Nation','Forum')}${ch(cats,'cat')}${T()?`<div class="grid3"><div>${posts}</div><div>${side}</div></div>`:posts}</div><button class="fab" data-a="toast" data-v="New post" aria-label="New post">${I('plus')}</button>`;
}
function market(){
  const cards=LIST.map(l=>`<div class="card" style="margin:0"><div class="lst">${I('bag')}</div><span class="tag ${l.ty==='Wanted'?'b':'g'}">${l.ty}</span><div style="font-weight:600;margin:6px 0 4px">${l.t}</div><div class="price">${l.p}</div><div class="sm mute">${l.cond} · ${l.loc}</div><div class="row sm" style="margin-top:8px"><span class="mono">${l.s}</span><span class="grow"></span><button class="link" data-a="toast" data-v="Message sent to ${l.s}">Message</button></div></div>`).join('');
  return `<div class="pad">${head('Gear','Marketplace')}<label class="search">${I('search')}<input placeholder="Search radios, antennas, parts" aria-label="Search listings"></label><div class="${T()?'tiles':'lg'}">${cards}</div></div><button class="fab" data-a="toast" data-v="New listing" aria-label="New listing">${I('plus')}</button>`;

function equip(){
  const rows=EQUIP.map(e=>{const st=S.eq[e.id]||e.st;const o=st==='out';return `<div class="card"><div class="row"><div class="grow"><b>${e.n}</b><div class="sm mute">${e.ty} · <span class="mono">${e.asset}</span></div></div><span class="tag ${st==='avail'?'g':st==='out'?'o':''}">${st==='avail'?'Available':st==='out'?'Checked out':'In repair'}</span></div>
   ${st==='repair'?`<div class="sm mute" style="margin-top:8px">${e.who}</div>`:`<div class="row" style="margin-top:10px"><button class="btn sm ${st==='avail'?'':'ghost'}" data-a="eq" data-v="${e.id}">${st==='avail'?'Check out':'Return'}</button><button class="btn ghost sm" data-a="toast" data-v="Reservation calendar opens">Reserve</button>${o&&!S.eq[e.id]?`<span class="sm mute">${e.who}</span>`:o?'<span class="sm mute">You · due Oct 18</span>':''}</div>`}</div>`}).join('');
  return `<div class="pad">${head('Club gear','Equipment')}${ch(['All','Radios','Antennas','Test gear'],'eqf')}${rows}<div class="card"><div class="eyebrow">Suggest gear</div><div class="sm mute" style="margin:6px 0 10px">Recommend something the club should buy. Members vote it up.</div><button class="btn ghost sm" data-a="toast" data-v="Suggestion form opens">Make a suggestion</button></div></div>`;
}
function trips(){
  const route=`<div class="map" style="min-height:190px;flex:none;height:190px"><svg class="bg" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M8 48C24 40 30 20 48 26S78 14 92 10" stroke="#ff8a1f" stroke-width="1.8" fill="none" stroke-dasharray="3 2"/></svg>
   <div class="pin" style="left:8%;top:84%"><i style="background:var(--good)"></i></div><div class="pin" style="left:48%;top:46%"><i></i><span>W5RN</span></div><div class="pin" style="left:70%;top:34%"><i></i><span>K5NW</span></div><div class="pin" style="left:92%;top:20%"><i style="background:var(--bad)"></i></div></div>`;
  const stat=`<div class="stat"><div><b>412 mi</b><span>Distance</span></div><div><b>6h 40m</b><span>Drive time</span></div><div><b>9</b><span>Repeaters</span></div></div>`;
  const stops=['Dallas, TX','Ardmore, OK','Oklahoma City, OK','Tulsa, OK'].map((s,i)=>`<div class="row set" style="justify-content:flex-start"><span class="tag ${i===0?'g':i===3?'o':''}">${i===0?'Start':i===3?'End':'Stop '+i}</span><b>${s}</b></div>`).join('');
  return `<div class="pad">${head('Planner','Trips')}<div class="card"><div class="row"><div class="grow"><b>Tulsa Hamfest run</b><div class="sm mute">Oct 24–26 · optimized route</div></div><span class="tag o">Saved</span></div></div><div style="height:10px"></div>${route}${stat}<div class="card" style="padding:2px 14px">${stops}</div><div class="row wrap" style="margin-top:12px"><button class="btn" data-a="toast" data-v="Repeater list added to your trip">Repeaters along route</button><button class="btn ghost" data-a="toast" data-v="New trip">New trip</button></div></div>`;
}
function sdr(){
  const rows=SDR.map(s=>`<div class="card"><div class="row"><div class="grow"><b>${s.n}</b><div class="sm mute">${s.loc} · <span class="mono">${s.f}</span></div></div>${s.ok?'<span class="tag g">Verified</span>':'<span class="tag">Pending review</span>'}</div>
   <div class="row" style="margin-top:10px"><button class="btn sm ${S.sdr===s.id?'':'ghost'}" data-a="sdr" data-v="${s.id}">${I(S.sdr===s.id?'pause':'play')}${S.sdr===s.id?'Stop':'Listen'}</button>${S.sdr===s.id?'<div class="eq" aria-label="Playing"><i></i><i></i><i></i><i></i></div>':''}</div></div>`).join('');
  return `<div class="pad">${head('Receivers','SDR Streams')}${rows}<button class="btn ghost" style="margin-top:12px" data-a="toast" data-v="Submit a stream">${I('plus')}Submit a stream</button></div>`;
}
function log(){
  const rows=S.log.map(l=>`<div class="row set" style="justify-content:flex-start;gap:12px"><div class="mono sm mute" style="width:48px">${l.d}</div><div class="grow"><b>${l.c}</b> <span class="mono mute">${l.f} ${l.m}</span><div class="sm mute">${l.n}</div></div><span class="tag">${l.s}</span></div>`).join('');
  const form=`<div class="card"><h3 style="margin-bottom:10px">Log a contact</h3><div class="grid2" style="gap:10px"><div class="fld"><label for="lc">Callsign</label><input id="lc" placeholder="W5ABC"></div><div class="fld"><label for="lf">Frequency</label><input id="lf" placeholder="146.940"></div></div><div class="grid2" style="gap:10px"><div class="fld"><label for="lm">Mode</label><select id="lm"><option>FM</option><option>SSB</option><option>DMR</option><option>CW</option></select></div><div class="fld"><label for="ls">Signal</label><input id="ls" placeholder="5/9"></div></div><button class="btn" data-a="addlog" style="width:100%">Add to logbook</button></div>`;
  const st=`<div class="stat"><div><b>${128+S.log.length-3}</b><span>Contacts</span></div><div><b>41</b><span>Callsigns</span></div><div><b>6</b><span>Repeaters</span></div></div>`;
  return `<div class="pad">${head('Contacts','Logbook')}${st}${T()?`<div class="grid2"><div class="card" style="padding:2px 14px;margin:0">${rows}</div>${form}</div>`:`${form}<div class="card" style="padding:2px 14px">${rows}</div>`}<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-a="toast" data-v="ADIF export ready">Export ADIF</button><button class="btn ghost sm" data-a="toast" data-v="CSV export ready">Export CSV</button></div></div>`;
}
function board(){
  const rows=BOARD.map((b,i)=>`<div class="row set" style="justify-content:flex-start"><div class="rk" ${b[0]==='WSIQ838'?'style="color:var(--accent)"':''}>${i+1}</div>${av(b[0],i<3)}<div class="grow"><b>${b[0]}</b>${b[0]==='WSIQ838'?' <span class="tag o">You</span>':''}</div><span class="mono">${b[1].toLocaleString()} XP</span></div>`).join('');
  const bd=BADGES.map(b=>`<div class="tile" style="opacity:${b[2]?1:.45};min-height:0;align-items:flex-start">${I('trophy')}<b style="font-size:14px">${b[0]}</b><span>${b[1]}${b[2]?'':' · locked'}</span></div>`).join('');
  return `<div class="pad">${head('This month','Leaderboard')}${ch(['This month','All time','My clubs'],'lb')}${T()?`<div class="grid2"><div class="card" style="padding:2px 14px;margin:0">${rows}</div><div><div class="tiles" style="grid-template-columns:1fr 1fr">${bd}</div></div></div>`:`<div class="card" style="padding:2px 14px">${rows}</div><div class="sec"><h3>Badges</h3></div><div class="tiles">${bd}</div>`}</div>`;
}
function fcc(){
  const q=S.fcc.trim().toUpperCase();
  const r=q?FCC.find(x=>x.c===q):null;
  const res=!q?`<div class="card mute">Type a callsign. Try WSIQ838 or W5ABC.</div>`:r?`<div class="card"><div class="row"><div class="grow"><div class="mono" style="font-size:22px;color:var(--accent)">${r.c}</div><b>${r.nm}</b></div><span class="tag g">${r.st}</span></div><div class="stat"><div><b>${r.svc.split(' · ')[1]}</b><span>Class</span></div><div><b>${r.exp}</b><span>Expires</span></div><div><b>${r.city.split(',')[1]}</b><span>State</span></div></div><div class="sm mute">${r.city} · FCC ULS record</div></div>`:`<div class="card mute">No license found for ${q}. Check the spelling.</div>`;
  return `<div class="pad">${head('FCC database','Callsign Lookup')}<label class="search">${I('search')}<input id="fq" placeholder="Enter a callsign" value="${S.fcc}" autocapitalize="characters"></label>${res}</div>`;
}
function msgs(){
  const f=FRIENDS.find(x=>x.c===S.conv)||FRIENDS[0];
  const list=FRIENDS.map(x=>`<button class="item" data-a="conv" data-v="${x.c}" aria-selected="${S.conv===x.c}">${av(x.c,x.on)}<div class="grow"><b>${x.n}</b> <span class="mono sm mute">${x.c}</span><div class="sm mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.last}</div></div><div style="text-align:right"><div class="sm mute">${x.t}</div>${x.un?`<span class="tag o">${x.un}</span>`:''}</div></button>`).join('');
  const thread=`<div class="chat">${(S.msgs[f.c]||[]).map(m=>`<div class="bub ${m[0]==='me'?'me':''}">${m[1]}</div>`).join('')}</div><label class="search" style="margin:0"><input id="mi" placeholder="Message ${f.n}" aria-label="Message"><button class="link" data-a="send" aria-label="Send" style="padding:8px">${I('send')}</button></label>`;
  if(T())return `<div class="two" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div class="l"><div class="pad">${head('Friends','Messages')}${list}</div></div><div class="r"><div class="pad" style="padding-top:26px"><div class="row" style="margin-bottom:14px">${av(f.c,f.on)}<div><b>${f.n}</b><div class="sm mute mono">${f.c}</div></div></div>${thread}</div></div></div>`;
  return `<div class="pad">${head('Friends','Messages')}${list}<div class="sec"><h3>${f.n}</h3></div>${thread}</div>`;
}
function me(){
  const sw=(k,t,d)=>`<div class="set"><div><div style="font-weight:500">${t}</div><div class="sm mute">${d}</div></div><button class="sw" role="switch" aria-checked="${S.notif[k]}" aria-label="${t}" data-a="sw" data-v="${k}"></button></div>`;
  const prof=`<div class="card"><div class="row"><div class="av" style="width:64px;height:64px;font-size:22px;background:#2a1604;border-color:#5a3512">SE</div><div class="grow"><div style="font:700 24px var(--display)">Sean</div><div class="row"><span class="mono" style="color:var(--accent)">WSIQ838</span><span class="ver">${I('check')}Verified</span></div><div class="sm mute">General · Member since 2024 · Dallas, TX</div></div></div>
    <div class="stat"><div><b>128</b><span>Contacts</span></div><div><b>12</b><span>Net streak</span></div><div><b>6</b><span>Badges</span></div></div></div>`;
  const prefs=`<div class="sec"><h3>Notifications</h3></div><div class="card" style="padding:2px 14px">${sw('push','Push notifications','Announcements and replies')}${sw('nets','Net reminders','15 minutes before start')}${sw('dm','Direct messages','From friends only')}</div>
    <div class="sec"><h3>Privacy and access</h3></div><div class="card" style="padding:2px 14px">${sw('loc','Share my location','Visible on the map to members')}${sw('bio','Face ID sign-in','Skip the password')}${sw('offline','Offline directory','Saved to this device')}</div>`;
  const out=`<button class="btn ghost" style="margin-top:12px" data-a="toast" data-v="Signed out">Sign out</button>`;
  return T()?`<div class="pad">${head('Account','Me')}<div class="grid2"><div>${prof}${out}</div><div style="margin-top:-22px">${prefs}</div></div></div>`:`<div class="pad">${head('Account','Me')}${prof}${prefs}${out}</div>`;
}
function more(){
  return `<div class="pad">${head('Everything else','More')}<div class="tiles">${MORE.map(m=>`<button class="tile" data-a="tab" data-v="${m[0]}">${I(m[2])}<b>${m[1]}</b><span>${m[3]}</span></button>`).join('')}</div></div>`;
}
const SCR={home,dir,nets,clubs,parks,forum,market,equip,trips,sdr,log,board,fcc,msgs,me,more};

function render(){
  const dev=document.getElementById('dev'),t=T();
  dev.className='dev '+S.dev;
  const rail=t?`<nav class="rail" aria-label="Main"><div class="brand"><span style="color:var(--accent)">${I('tower')}</span>Repeater Nation</div>${NAV.map(g=>`<div class="grp">${g[0]}</div>${g[1].map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${I(i)}${l}</button>`).join('')}`).join('')}<div class="me"><div class="av on">SE</div><div class="grow"><b>Sean</b><div class="sm mute mono">WSIQ838</div></div><button data-a="tab" data-v="me" style="padding:6px;border-radius:8px" aria-label="Me" ${S.tab==='me'?'aria-current="page"':''}>${I('user')}</button></div></nav>`:'';
  const cur=MAIN.includes(S.tab)?S.tab:'more';
  const TB=[['home','Home','home'],['dir','Repeaters','tower'],['nets','Nets','cal'],['clubs','Clubs','users'],['more','More','grid']];
  const tabs=t?'':`<nav class="tabs" aria-label="Main">${TB.map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${cur===k?'aria-current="page"':''}>${I(i)}${l}</button>`).join('')}</nav>`;
  const modal=(!t&&S.sheet)?(()=>{const r=REPS.find(x=>x.id===S.sel);return `<div class="modal" data-a="closeSheet"><div class="sheet" onclick="event.stopPropagation()"><div style="display:flex;justify-content:flex-end"><button data-a="closeSheet" aria-label="Close" style="color:var(--mute)">${I('x')}</button></div>${repDetail(r)}</div></div>`})():'';
  const prev=dev.querySelector('.body')?.scrollTop||0;
  const backBtn=(!t&&!MAIN.includes(S.tab))?`<div style="padding:4px 14px 0"><button class="back" data-a="tab" data-v="more">${I('back')}More</button></div>`:'';
  dev.innerHTML=`<div class="scr">${rail}<div class="col"><div class="sb"><span>9:41</span><span>${t?'Tue Oct 13':'5G ▮▮▮'}</span></div>${backBtn}<div class="body" id="body">${SCR[S.tab]()}</div>${tabs}</div>${modal}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}</div>`;
  const b=dev.querySelector('.body');
  if(b&&S._keep)b.scrollTop=prev;
  S._keep=false;
  for(const id of ['q','fq']){const q=document.getElementById(id);if(q&&S._focus===id){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  S._focus=null;
  document.getElementById('bp').setAttribute('aria-pressed',!t);
  document.getElementById('bt').setAttribute('aria-pressed',t);
  fit();
}
let tt;
function toast(m){S.toast=m;S._keep=true;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';S._keep=true;render()},1500)}
const keep=()=>{S._keep=true;render()};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='tab'){S.tab=v;S.sheet=false;render()}
  else if(a==='set'){S[el.dataset.k]=v;keep()}
  else if(a==='sel'){S.sel=+v;S.sheet=!T();keep()}
  else if(a==='pin'){S.sel=+v;keep()}
  else if(a==='detail'){S.sel=+v;S.view='list';S.sheet=!T();render()}
  else if(a==='closeSheet'){S.sheet=false;keep()}
  else if(a==='like'){S.liked[v]=!S.liked[v];keep()}
  else if(a==='fav'){S.liked['r'+v]=!S.liked['r'+v];keep()}
  else if(a==='sw'){S.notif[v]=!S.notif[v];keep()}
  else if(a==='checkin'){S.checked=!S.checked;S.toast=S.checked?'Checked in to Nation Wide Net':'';keep();if(S.checked){clearTimeout(tt);tt=setTimeout(()=>{S.toast='';keep()},1500)}}
  else if(a==='club'){S.club=+v;keep()}
  else if(a==='join'){S.joined[v]=!S.joined[v];toast(S.joined[v]?'Joined club':'Left club')}
  else if(a==='pfav'){S.fav[v]=!S.fav[v];keep()}
  else if(a==='eq'){const cur=S.eq[v]||EQUIP.find(x=>x.id==v).st;S.eq[v]=cur==='avail'?'out':'avail';toast(S.eq[v]==='out'?'Checked out, due in 7 days':'Returned, thanks');}
  else if(a==='sdr'){S.sdr=S.sdr==v?null:+v;keep()}
  else if(a==='addlog'){const c=document.getElementById('lc').value.trim().toUpperCase();if(!c){toast('Enter a callsign first');return}
    S.log.unshift({id:Date.now(),d:'Today',c,f:document.getElementById('lf').value||'—',m:document.getElementById('lm').value,s:document.getElementById('ls').value||'—',n:'Logged from the app'});toast('Contact added')}
  else if(a==='conv'){S.conv=v;keep()}
  else if(a==='send'){const i=document.getElementById('mi'),x=i.value.trim();if(!x)return;(S.msgs[S.conv]=S.msgs[S.conv]||[]).push(['me',x]);keep()}
  else if(a==='toast'){toast(v)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S._focus='q';keep()}
  if(e.target.id==='fq'){S.fcc=e.target.value;S._focus='fq';keep()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi'){e.preventDefault();document.querySelector('[data-a=send]').click()}});
document.getElementById('bp').onclick=()=>{S.dev='phone';S.sheet=false;render()};
document.getElementById('bt').onclick=()=>{S.dev='tablet';S.sheet=false;render()};

function fit(){
  const f=document.getElementById('fit'),d=document.getElementById('dev');
  d.style.transform='none';
  const w=d.offsetWidth,h=d.offsetHeight,sc=Math.min(1,(document.documentElement.clientWidth-32)/w);
  d.style.transformOrigin='top left';d.style.transform=`scale(${sc})`;
  f.style.width=(w*sc)+'px';f.style.height=(h*sc)+'px';
}
window.addEventListener('resize',fit);
render();
</script>
