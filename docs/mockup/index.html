<title>Repeater Nation App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a device stage. Phone = bottom tab bar, one pane. Tablet = side rail, two panes. Dark by choice, like the radio client. */
:root{
  --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#262d36; --fg:#eef1f4; --mute:#8a95a3;
  --accent:#ff8a1f; --accent-ink:#1a0e00; --good:#2fc46a; --warn:#f2c14e; --bad:#ef5350;
  --display:"Barlow Semi Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1100px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.top h1{font:700 28px/1 var(--display);margin:0;letter-spacing:.01em}
.top p{margin:6px 0 0;color:var(--mute);max-width:46ch}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 18px;border-radius:8px;color:var(--mute);font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.stage{display:flex;justify-content:center}
.fit{position:relative}
.dev{position:relative;background:#000;border:1px solid #2a323c;box-shadow:0 30px 80px #0009;overflow:hidden;display:flex;flex-direction:column}
.dev.phone{width:390px;height:810px;border-radius:44px;padding:10px}
.dev.tablet{width:1040px;height:740px;border-radius:30px;padding:12px}
.scr{flex:1;min-height:0;background:var(--bg);border-radius:34px;overflow:hidden;display:flex;position:relative}
.tablet .scr{border-radius:20px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
/* status bar */
.sb{display:flex;justify-content:space-between;padding:12px 24px 4px;font:500 12px var(--mono);color:var(--fg);flex:none}
.tablet .sb{padding:8px 20px 0}
.body{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:8px 18px 24px}
.tablet .pad{padding:10px 28px 28px}
/* nav */
.tabs{display:flex;border-top:1px solid var(--line);background:#0e1115;padding:6px 6px 14px;flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:500;border-radius:10px}
.tabs button[aria-current=page]{color:var(--accent)}
.rail{width:210px;flex:none;border-right:1px solid var(--line);background:#0e1115;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;font:700 18px var(--display)}
.rail button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mute);font-weight:500;text-align:left}
.rail button[aria-current=page]{background:var(--panel2);color:var(--fg)}
.rail button[aria-current=page] svg{color:var(--accent)}
.rail .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* type */
.eyebrow{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2.title{font:700 32px/1.05 var(--display);margin:2px 0 14px;text-wrap:balance}
.tablet h2.title{font-size:38px}
h3{font:600 17px var(--display);margin:0;letter-spacing:.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec a,.link{color:var(--accent);font-weight:500;font-size:13px}
.mono{font-family:var(--mono)}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{background:linear-gradient(135deg,#2a1604,#14181d 70%);border:1px solid #3a2410;border-radius:20px;padding:16px;position:relative;overflow:hidden}
.hero .big{font:700 26px/1.05 var(--display);margin:4px 0 10px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:10px 16px;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.sm{font-size:12px}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:500;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.av{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--display);letter-spacing:.04em;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.avs{display:flex;gap:14px;overflow:auto;scrollbar-width:none}
.avs div{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11px var(--mono);color:var(--mute)}
.ver{display:inline-flex;gap:4px;align-items:center;color:var(--good);font-size:11px;font-weight:600}
.ver svg{width:13px;height:13px;stroke-width:2.4}
.tag{font:500 11px var(--mono);padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--bad)}
.dot.busy{background:var(--warn)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;color:var(--fg);padding:13px 0;font:inherit;min-width:0}
.search input::placeholder{color:var(--mute)}
.rep{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.rep[aria-selected=true]{border-color:var(--accent);background:#1c1610}
.freq{font:500 20px var(--mono);letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat div{background:var(--panel2);border-radius:12px;padding:10px}
.stat b{display:block;font:500 15px var(--mono)}
.stat span{font-size:11px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;flex:1;min-height:0}
.two>.l{border-right:1px solid var(--line);overflow:auto;scrollbar-width:none}
.two>.r{overflow:auto;scrollbar-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
/* map */
.map{position:relative;border-radius:20px;overflow:hidden;background:#10161c;border:1px solid var(--line);flex:1;min-height:300px}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin i{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #0b0d10;display:block}
.pin.m i{background:#4aa3ff}
.pin[aria-pressed=true] i{box-shadow:0 0 0 6px #ff8a1f44;transform:rotate(-45deg) scale(1.2)}
.pin span{font:500 10px var(--mono);background:#0b0d10cc;padding:1px 5px;border-radius:5px;margin-top:3px}
.legend{position:absolute;left:12px;top:12px;display:flex;gap:10px;font-size:11px;background:#0b0d10cc;padding:6px 10px;border-radius:10px}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 18px 18px;margin-top:-22px;position:relative;z-index:2}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.modal{position:absolute;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;border-radius:inherit}
.modal .sheet{margin:0;width:100%;max-height:78%;overflow:auto}
/* posts */
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.post p{margin:8px 0 10px}
.acts{display:flex;gap:18px;color:var(--mute);font-size:13px}
.acts button{display:flex;gap:6px;align-items:center;color:var(--mute)}
.acts button[aria-pressed=true]{color:var(--accent)}
.acts svg{width:18px;height:18px}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.sw[aria-checked=true]{background:#3a2410;border-color:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(18px);background:var(--accent)}
.fab{position:absolute;right:16px;bottom:96px;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px #ff8a1f55;z-index:5}
.tablet .fab{bottom:24px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:#0b0d10;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:30;white-space:nowrap}
.note{max-width:1100px;margin:18px auto 0;color:var(--mute);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="top">
  <div>
    <h1>Repeater Nation App</h1>
    <p>Clickable mockup. Every tab, filter, pin and toggle works. All names, callsigns and frequencies are examples.</p>
  </div>
  <div class="seg" role="group" aria-label="Device">
    <button id="bp" aria-pressed="true">Phone</button>
    <button id="bt" aria-pressed="false">Tablet</button>
  </div>
</div>
<div class="stage" id="stage"><div class="fit" id="fit"><div class="dev phone" id="dev"></div></div></div>
<p class="note">Phone uses a bottom tab bar. Tablet swaps it for a side rail and shows list and detail side by side.</p>

<script>
const ic={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 tower:'<path d="M12 12v9M8 21l4-9 4 9M9 8a4 4 0 0 1 6 0M6.5 5.5a8 8 0 0 1 11 0"/><circle cx="12" cy="10.5" r="1"/>',
 map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 heart:'<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
 nav:'<path d="M3 11l19-9-9 19-2-8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 star:'<path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"/>'
};
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`;

const REPS=[
 {id:1,call:'W5RN',name:'Nation Hub',f:'146.940',off:'−',tone:'100.0',band:'2m',mode:'FM',city:'Dallas, TX',d:4.2,st:'on',users:18,x:46,y:55,note:'Open to all. Weekly net Tuesdays 8 PM.'},
 {id:2,call:'K5NW',name:'Northwest Link',f:'444.325',off:'+',tone:'131.8',band:'70cm',mode:'FM',city:'Plano, TX',d:11.6,st:'on',users:7,x:55,y:30,note:'Linked to Nation Hub on weekends.'},
 {id:3,call:'N5DMR',name:'Metro DMR',f:'442.100',off:'+',tone:'CC1',band:'70cm',mode:'DMR',city:'Irving, TX',d:9.1,st:'busy',users:23,x:33,y:46,note:'Talkgroup 31480. Color code 1.'},
 {id:4,call:'WB5SE',name:'Southeast Wide',f:'147.180',off:'+',tone:'110.9',band:'2m',mode:'FM',city:'Mesquite, TX',d:15.3,st:'on',users:4,x:68,y:60,note:'Wide-area coverage. Good in vehicles.'},
 {id:5,call:'KE5LS',name:'Lakeside',f:'145.330',off:'−',tone:'88.5',band:'2m',mode:'FM',city:'Rockwall, TX',d:22.0,st:'off',users:0,x:78,y:40,note:'Down for antenna work until Saturday.'},
 {id:6,call:'W5YSF',name:'Fusion South',f:'440.950',off:'+',tone:'C4FM',band:'70cm',mode:'C4FM',city:'Cedar Hill, TX',d:18.4,st:'on',users:11,x:36,y:72,note:'Yaesu System Fusion. Digital only.'}
];
const MEM=[{c:'KD5JAX',x:42,y:50},{c:'N5TOM',x:60,y:42},{c:'W5ABC',x:30,y:62},{c:'KF5QRS',x:72,y:52},{c:'AE5MX',x:52,y:68}];
const POSTS=[
 {id:1,c:'KD5JAX',n:'Jax',t:'14m',txt:'Worked a clean 60 mile simplex contact on 446.000 this morning from the ridge. Anyone want to try for 80 on Saturday?',l:24,r:6},
 {id:2,c:'W5ABC',n:'Alice',t:'2h',txt:'New tone for Lakeside is coming back as 88.5 once the antenna is fixed. Nothing else changes.',l:41,r:3},
 {id:3,c:'N5TOM',n:'Tom',t:'5h',txt:'Great turnout on last night\'s net. 31 check-ins, 4 first-timers. Welcome to the Nation!',l:67,r:12},
 {id:4,c:'KF5QRS',n:'Quinn',t:'1d',txt:'Looking for an Elmer near Garland to help me with a roll-up J-pole build. Happy to buy the coffee.',l:19,r:9}
];
const EVENTS=[
 {d:'TUE',n:'14',t:'Nation Wide Net',w:'8:00 PM · 146.940',s:'Starts in 2h 14m'},
 {d:'SAT',n:'18',t:'Ridge Simplex Day',w:'9:00 AM · 446.000',s:'Meetup'},
 {d:'SUN',n:'19',t:'New Ham Roundtable',w:'4:00 PM · Online',s:'Open to all'}
];
const ST={
 phone:{tab:'home',filter:'All',q:'',sel:null,sheet:false},
};
const S={dev:'phone',tab:'home',filter:'All',q:'',sel:1,sheet:false,liked:{},notif:{push:true,nets:true,dm:false,loc:false,bio:true,offline:true},toast:''};
const TABS=[['home','Home','home'],['dir','Repeaters','tower'],['map','Map','map'],['com','Community','chat'],['me','Me','user']];

const av=(c,on)=>`<div class="av ${on?'on':''}">${c.slice(0,2)}</div>`;
const stDot=s=>`<span class="dot ${s==='off'?'off':s==='busy'?'busy':''}"></span>`;
const stTxt=s=>s==='on'?'Online':s==='busy'?'Busy':'Offline';

function filtered(){
  return REPS.filter(r=>{
    const f=S.filter;
    if(f==='2m'&&r.band!=='2m')return false;
    if(f==='70cm'&&r.band!=='70cm')return false;
    if(f==='Digital'&&r.mode==='FM')return false;
    if(f==='Nearby'&&r.d>12)return false;
    const q=S.q.trim().toLowerCase();
    return !q||(r.call+r.name+r.city+r.f).toLowerCase().includes(q);
  });
}
function chips(){
  return `<div class="chips">${['All','Nearby','2m','70cm','Digital'].map(f=>`<button class="chip" data-a="filter" data-v="${f}" aria-pressed="${S.filter===f}">${f}</button>`).join('')}</div>`;
}
function repCard(r){
  return `<button class="rep" data-a="sel" data-v="${r.id}" aria-selected="${S.sel===r.id}">
    <div class="grow"><div class="row"><b>${r.call}</b>${stDot(r.st)}<span class="sm mute">${stTxt(r.st)}</span></div>
    <div class="sm mute">${r.name} · ${r.city}</div></div>
    <div style="text-align:right"><div class="freq">${r.f}</div><div class="sm mute">${r.d} mi · ${r.users} on</div></div></button>`;
}
function repDetail(r){
  return `<div class="eyebrow">${r.band} · ${r.mode}</div>
  <div class="row" style="align-items:baseline;gap:12px"><h2 class="title" style="margin:2px 0 0">${r.call}</h2>${stDot(r.st)}<span class="mute">${stTxt(r.st)}</span></div>
  <div class="mute">${r.name} · ${r.city}</div>
  <div class="freq" style="font-size:34px;margin:14px 0 0">${r.f} <span class="mute" style="font-size:16px">MHz</span></div>
  <div class="stat"><div><b>${r.off}${r.band==='2m'?'0.6':'5.0'}</b><span>Offset</span></div><div><b>${r.tone}</b><span>Tone</span></div><div><b>${r.users}</b><span>On now</span></div></div>
  <p class="mute" style="margin:0 0 16px">${r.note}</p>
  <div class="row" style="flex-wrap:wrap"><button class="btn" data-a="toast" data-v="Directions opened">${I('nav')}Directions</button><button class="btn ghost" data-a="fav" data-v="${r.id}">${I('star')}${S.liked['r'+r.id]?'Saved':'Save'}</button><button class="btn ghost" data-a="toast" data-v="Link copied">Share</button></div>`;
}

/* screens */
function home(){
  const t=S.dev==='tablet';
  const hero=`<div class="hero"><div class="eyebrow" style="color:#ffb066">Next net · Tuesday</div>
    <div class="big">Nation Wide Net</div>
    <div class="mute" style="margin-bottom:14px">8:00 PM on <span class="mono" style="color:var(--fg)">146.940</span> · hosted by W5RN</div>
    <div class="row"><button class="btn" data-a="toast" data-v="Reminder set for 7:45 PM">${I('bell')}Remind me</button><span class="sm mute">Starts in 2h 14m</span></div></div>`;
  const online=`<div class="sec"><h3>Members online</h3><button class="link" data-a="tab" data-v="map">See map</button></div>
    <div class="avs">${['KD5JAX','N5TOM','W5ABC','KF5QRS','AE5MX','K5LMN','WA5PJ'].map(c=>`<div>${av(c,true)}${c}</div>`).join('')}</div>`;
  const news=`<div class="sec"><h3>Announcements</h3><button class="link">All</button></div>
    <div class="card" style="margin-bottom:10px"><span class="tag">Update</span><div style="margin-top:8px;font-weight:600">Lakeside repeater back Saturday</div><div class="sm mute">Antenna replacement finishes this weekend.</div></div>
    <div class="card"><span class="tag">New</span><div style="margin-top:8px;font-weight:600">Callsign verification is open</div><div class="sm mute">Get the green badge on your profile in under a minute.</div></div>`;
  const ev=`<div class="sec"><h3>Upcoming</h3><button class="link">Calendar</button></div>
    <div class="card" style="padding:4px 14px">${EVENTS.map(e=>`<div class="row set" style="gap:14px"><div style="text-align:center;width:42px"><div class="eyebrow">${e.d}</div><div style="font:700 24px var(--display)">${e.n}</div></div><div class="grow"><b>${e.t}</b><div class="sm mute">${e.w}</div></div><span class="tag">${e.s}</span></div>`).join('')}</div>`;
  const nearby=`<div class="sec"><h3>Nearest repeaters</h3><button class="link" data-a="tab" data-v="dir">All</button></div>${REPS.slice().sort((a,b)=>a.d-b.d).slice(0,3).map(repCard).join('')}`;
  return `<div class="pad"><div class="eyebrow">Good evening</div><h2 class="title">Sean · <span class="mono" style="font-size:.7em;color:var(--accent)">WSIQ838</span></h2>
  ${t?`<div class="grid3"><div>${hero}${online}${ev}</div><div>${news}${nearby}</div></div>`:`${hero}${online}${nearby}${ev}${news}`}</div>`;
}
function dir(){
  const list=filtered();
  const L=`<div class="pad"><div class="eyebrow">Directory</div><h2 class="title">Repeaters</h2>
    <label class="search">${I('search')}<input id="q" type="search" placeholder="Callsign, city or frequency" value="${S.q.replace(/"/g,'&quot;')}"></label>
    ${chips()}<div style="height:12px"></div>
    ${list.length?list.map(repCard).join(''):'<div class="card mute">No repeaters match. Try clearing a filter.</div>'}</div>`;
  if(S.dev==='tablet'){
    const r=REPS.find(x=>x.id===S.sel)||list[0]||REPS[0];
    return `<div class="two"><div class="l">${L}</div><div class="r"><div class="pad" style="padding-top:26px">${repDetail(r)}<div class="map" style="margin-top:20px;min-height:180px;height:180px;flex:none">${mapInner(r.id,true)}</div></div></div></div>`;
  }
  return L;
}
function mapInner(selId,small){
  const pins=REPS.map(r=>`<button class="pin" style="left:${r.x}%;top:${r.y}%" data-a="pin" data-v="${r.id}" aria-pressed="${selId===r.id}" aria-label="${r.call}"><i></i>${small?'':`<span>${r.call}</span>`}</button>`).join('');
  const mem=small?'':MEM.map(m=>`<div class="pin m" style="left:${m.x}%;top:${m.y}%"><i></i></div>`).join('');
  return `<svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <g stroke="#1e2833" stroke-width=".25" fill="none">${[10,20,30,40,50,60,70,80,90].map(n=>`<path d="M${n} 0V100M0 ${n}H100"/>`).join('')}</g>
    <path d="M0 62C20 52 30 70 48 58S78 36 100 44" stroke="#2a3a4a" stroke-width="1.6" fill="none"/>
    <path d="M30 0C34 30 44 40 40 100" stroke="#24313f" stroke-width="1" fill="none"/>
    <path d="M0 20C30 22 60 8 100 18" stroke="#24313f" stroke-width="1" fill="none"/>
    <circle cx="46" cy="55" r="22" fill="#ff8a1f" opacity=".07"/><circle cx="46" cy="55" r="12" fill="#ff8a1f" opacity=".08"/></svg>${pins}${mem}`;
}
function map(){
  const r=REPS.find(x=>x.id===S.sel)||REPS[0];
  const m=`<div class="map">${mapInner(S.sel,false)}<div class="legend"><span><span class="dot" style="background:var(--accent)"></span> Repeater</span><span><span class="dot" style="background:#4aa3ff"></span> Members</span></div></div>`;
  const card=`<div class="sheet"><div class="row"><div class="grow"><div class="row"><b style="font:700 20px var(--display)">${r.call}</b>${stDot(r.st)}<span class="sm mute">${stTxt(r.st)}</span></div><div class="sm mute">${r.name} · ${r.d} mi</div></div><div class="freq">${r.f}</div></div>
    <div class="row" style="margin-top:12px"><button class="btn grow" style="justify-content:center" data-a="toast" data-v="Directions opened">${I('nav')}Directions</button><button class="btn ghost" data-a="detail" data-v="${r.id}">Details</button></div></div>`;
  if(S.dev==='tablet')return `<div class="two" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div style="padding:14px 0 28px 28px;display:flex;flex-direction:column;min-height:0"><div class="eyebrow">Coverage</div><h2 class="title" style="margin-bottom:10px">Map</h2>${m}</div><div class="r"><div class="pad" style="padding-top:26px">${repDetail(r)}</div></div></div>`;
  return `<div style="display:flex;flex-direction:column;height:100%"><div style="padding:8px 18px 0"><div class="eyebrow">Coverage</div><h2 class="title" style="margin-bottom:10px">Map</h2></div><div style="padding:0 12px;flex:1;display:flex;min-height:0">${m}</div>${card}</div>`;
}
function com(){
  const posts=POSTS.map(p=>`<div class="post"><div class="row">${av(p.c,p.id<3)}<div class="grow"><b>${p.n}</b> <span class="ver">${I('check')}${p.c}</span></div><span class="sm mute">${p.t}</span></div>
   <p>${p.txt}</p><div class="acts"><button data-a="like" data-v="${p.id}" aria-pressed="${!!S.liked[p.id]}">${I('heart')}${p.l+(S.liked[p.id]?1:0)}</button><button data-a="toast" data-v="Reply box opens here">${I('chat')}${p.r}</button></div></div>`).join('');
  const side=`<div class="card"><h3>Active topics</h3><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${['#antennas','#simplex','#newhams','#nets','#dmr','#gear'].map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>
   <div class="card" style="margin-top:12px"><h3>Members online</h3><div class="avs" style="margin-top:12px;flex-wrap:wrap">${['KD5JAX','N5TOM','W5ABC','KF5QRS'].map(c=>`<div>${av(c,true)}${c}</div>`).join('')}</div></div>`;
  const t=S.dev==='tablet';
  return `<div class="pad"><div class="eyebrow">The Nation</div><h2 class="title">Community</h2>${t?`<div class="grid3"><div>${posts}</div><div>${side}</div></div>`:posts}</div><button class="fab" data-a="toast" data-v="Compose a post" aria-label="New post">${I('plus')}</button>`;
}
function me(){
  const sw=(k,t,d)=>`<div class="set"><div><div style="font-weight:500">${t}</div><div class="sm mute">${d}</div></div><button class="sw" role="switch" aria-checked="${S.notif[k]}" aria-label="${t}" data-a="sw" data-v="${k}"></button></div>`;
  const prof=`<div class="card"><div class="row"><div class="av" style="width:64px;height:64px;font-size:22px;background:#2a1604;border-color:#5a3512">SE</div><div class="grow"><div style="font:700 24px var(--display)">Sean</div><div class="row"><span class="mono" style="color:var(--accent)">WSIQ838</span><span class="ver">${I('check')}Verified</span></div><div class="sm mute">Member since 2024 · Dallas, TX</div></div></div>
    <div class="stat"><div><b>128</b><span>Check-ins</span></div><div><b>14</b><span>Nets hosted</span></div><div><b>6</b><span>Saved</span></div></div></div>`;
  const prefs=`<div class="sec"><h3>Notifications</h3></div><div class="card" style="padding:2px 14px">${sw('push','Push notifications','Announcements and replies')}${sw('nets','Net reminders','15 minutes before start')}${sw('dm','Direct messages','From verified members only')}</div>
    <div class="sec"><h3>Privacy and access</h3></div><div class="card" style="padding:2px 14px">${sw('loc','Share my location','Visible on the map to members')}${sw('bio','Face ID sign-in','Skip the password')}${sw('offline','Offline directory','Saved to this device')}</div>`;
  if(S.dev==='tablet')return `<div class="pad"><div class="eyebrow">Account</div><h2 class="title">Me</h2><div class="grid2"><div>${prof}<button class="btn ghost" style="margin-top:12px" data-a="toast" data-v="Signed out">Sign out</button></div><div style="margin-top:-22px">${prefs}</div></div></div>`;
  return `<div class="pad"><div class="eyebrow">Account</div><h2 class="title">Me</h2>${prof}${prefs}<button class="btn ghost" style="margin-top:16px;width:100%;justify-content:center" data-a="toast" data-v="Signed out">Sign out</button></div>`;
}
const SCR={home,dir,map,com,me};

function render(){
  const dev=document.getElementById('dev');
  const t=S.dev==='tablet';
  dev.className='dev '+S.dev;
  const rail=t?`<nav class="rail" aria-label="Main"><div class="brand"><span style="color:var(--accent)">${I('tower')}</span>Repeater Nation</div>${TABS.slice(0,4).map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${I(i)}${l}</button>`).join('')}<div class="me"><div class="av on">SE</div><div class="grow"><b>Sean</b><div class="sm mute mono">WSIQ838</div></div><button data-a="tab" data-v="me" style="padding:6px;border-radius:8px" aria-label="Me" ${S.tab==='me'?'aria-current="page"':''}>${I('user')}</button></div></nav>`:'';
  const tabs=t?'':`<nav class="tabs" aria-label="Main">${TABS.map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${I(i)}${l}</button>`).join('')}</nav>`;
  const modal=(!t&&S.sheet)?(()=>{const r=REPS.find(x=>x.id===S.sel);return `<div class="modal" data-a="closeSheet"><div class="sheet" onclick="event.stopPropagation()"><div style="display:flex;justify-content:flex-end"><button data-a="closeSheet" aria-label="Close" style="color:var(--mute)">${I('x')}</button></div>${repDetail(r)}</div></div>`})():'';
  const prevScroll=dev.querySelector('.body')?.scrollTop||0;
  dev.innerHTML=`<div class="scr">${rail}<div class="col"><div class="sb"><span>9:41</span><span>${t?'Tue Oct 13':'5G ▮▮▮'}</span></div><div class="body" id="body">${SCR[S.tab]()}</div>${tabs}</div>${modal}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}</div>`;
  const b=dev.querySelector('.body');
  if(b&&S._keep)b.scrollTop=prevScroll;
  S._keep=false;
  const q=document.getElementById('q');
  if(q&&S._focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S._focusQ=false}
  document.getElementById('bp').setAttribute('aria-pressed',!t);
  document.getElementById('bt').setAttribute('aria-pressed',t);
  fit();
}
let tt;
function toast(m){S.toast=m;S._keep=true;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';S._keep=true;render()},1500)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='tab'){S.tab=v;S.sheet=false;render()}
  else if(a==='filter'){S.filter=v;S._keep=true;render()}
  else if(a==='sel'){S.sel=+v;S.sheet=S.dev==='phone';S._keep=true;render()}
  else if(a==='pin'){S.sel=+v;S._keep=true;render()}
  else if(a==='detail'){S.sel=+v;S.tab='dir';S.sheet=S.dev==='phone';render()}
  else if(a==='closeSheet'){S.sheet=false;S._keep=true;render()}
  else if(a==='like'){S.liked[v]=!S.liked[v];S._keep=true;render()}
  else if(a==='fav'){S.liked['r'+v]=!S.liked['r'+v];S._keep=true;render()}
  else if(a==='sw'){S.notif[v]=!S.notif[v];S._keep=true;render()}
  else if(a==='toast'){toast(v)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S._focusQ=true;S._keep=true;render()}
});
document.getElementById('bp').onclick=()=>{S.dev='phone';S.sheet=false;render()};
document.getElementById('bt').onclick=()=>{S.dev='tablet';S.sheet=false;render()};

function fit(){
  const f=document.getElementById('fit'),d=document.getElementById('dev');
  d.style.transform='none';
  const w=d.offsetWidth,h=d.offsetHeight,sc=Math.min(1,(document.documentElement.clientWidth-32)/w);
  d.style.transformOrigin='top left';d.style.transform=`scale(${sc})`;
  f.style.width=(w*sc)+'px';f.style.height=(h*sc)+'px';
}
window.addEventListener('resize',fit);
render();
</script>
